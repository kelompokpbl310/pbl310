<!-- Mobile Navigation (Horizontal Scroll) -->
<div class="lg:hidden overflow-x-auto pb-2 -mx-6 px-6 mb-6" role="navigation" aria-label="Menu profil">
  <div class="flex min-w-max gap-2">
    {% set mobile_nav = [
      ('akun', 'Akun',
        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>'
      ),
      ('keamanan', 'Keamanan',
        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>'
      ),
      ('riwayat', 'Riwayat Pesanan',
        '<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" /></svg>'
      ),
    ] %}
    {% for key, label, icon in mobile_nav %}
      <a
        href="{{ url_for('main.profil' if key == 'akun' else 'main.profil_' + key) }}"
        class="flex shrink-0 items-center gap-1.5 rounded-full border-2 py-2 px-4 text-sm font-semibold transition-all duration-150 whitespace-nowrap
          {% if key == active_tab %}border-gold bg-cream text-maroon-dark{% else %}border-transparent bg-transparent text-ink/70 hover:border-cream/30 hover:bg-cream hover:text-maroon-dark{% endif %}"
        aria-current="{% if key == active_tab %}page{% endif %}"
      >
        <span>{{ icon | safe }}</span>{{ label }}
      </a>
    {% endfor %}
  </div>
</div>
